<title>Ndou Fhumulani Certificates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: thesis-page reading column; the featured project reads like a short paper with figures set on white "plates" */
:root {
  --bg: #F5F7FA;
  --surface: #FFFFFF;
  --ink: #15233F;
  --muted: #5B6679;
  --rule: #D8DEE8;
  --accent: #0E7480;
  --accent-soft: #DCEFF1;
  --code-bg: #EEF2F6;
  --plate: #FFFFFF;
  --display: "Spectral", Georgia, "Times New Roman", serif;
  --body: "Source Sans 3", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1522; --surface: #151E2E; --ink: #E5EAF2; --muted: #98A3B6;
    --rule: #2A3549; --accent: #55C2CD; --accent-soft: #163A41; --code-bg: #111A28; --plate: #F4F6F9; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1522; --surface: #151E2E; --ink: #E5EAF2; --muted: #98A3B6;
  --rule: #2A3549; --accent: #55C2CD; --accent-soft: #163A41; --code-bg: #111A28; --plate: #F4F6F9; color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; }
img { max-width: 100%; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
.wrap {
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
p { margin: 0; }

/* Navigation */
.nav { border-bottom: 1px solid var(--rule); }
.nav .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 20px; padding-block: 14px; }
.nav .mark { font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--ink); text-decoration: none; }
.nav ul { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0; padding: 0; font-size: 15px; }
.nav ul a { color: var(--muted); text-decoration: none; }
.nav ul a:hover { color: var(--accent); }

/* Hero */
.hero { padding-block: 52px 44px; border-bottom: 1px solid var(--rule); }
.hero-grid { display: grid; grid-template-columns: 1fr 210px; gap: 40px; align-items: center; }
.hero-text { min-width: 0; }
.eyebrow { font-family: var(--mono); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
h1 { font-size: clamp(40px, 7vw, 66px); font-weight: 700; line-height: 1.02; letter-spacing: -.01em; }
.lede { font-size: 19px; color: var(--muted); max-width: 58ch; margin: 18px 0 24px; }
.lede strong { color: var(--ink); font-weight: 600; }
.links { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font: 600 15px var(--body); padding: 9px 16px; border-radius: 6px;
  border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
  text-decoration: none; cursor: pointer;
}
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.btn:hover { border-color: var(--accent); }
.portrait { width: 100%; max-width: 210px; aspect-ratio: 360 / 455; object-fit: cover; border-radius: 4px; display: block; justify-self: end; }

/* Sections */
main section { padding-block: 48px 8px; }
.sec-head { display: grid; grid-template-columns: 170px 1fr; gap: 24px; }
.sec-label { font-family: var(--mono); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 8px; }
.sec-body { min-width: 0; }
h2 { font-size: 30px; font-weight: 600; margin-bottom: 14px; }
h3 { font-size: 21px; font-weight: 600; line-height: 1.3; }
.stack { display: grid; gap: 14px; }
.prose { max-width: 66ch; }

/* Featured project */
.project-title { font-family: var(--display); font-style: italic; font-size: 23px; line-height: 1.4; max-width: 40ch; }
.project-meta { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-family: var(--mono); font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.sub { font-family: var(--mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-top: 18px; }
.equations { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 18px; overflow-x: auto; font-family: var(--display); font-size: 19px; line-height: 1.9; }
.equations .eq { white-space: nowrap; }
.equations .bc { font-size: 16px; color: var(--muted); font-family: var(--body); }
.equations i { font-style: italic; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .78em; line-height: 1.15; margin: 0 2px; }
.frac span:first-child { border-bottom: 1px solid currentColor; padding: 0 3px; }
.steps { margin: 0; padding-left: 22px; display: grid; gap: 6px; max-width: 66ch; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.stat { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.stat b { font-family: var(--display); font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat span { font-size: 15px; color: var(--muted); line-height: 1.4; }
.findings { margin: 0; padding-left: 20px; display: grid; gap: 8px; max-width: 66ch; }
.figures { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.figures figure { margin: 0; display: grid; gap: 8px; align-content: start; }
.plate { background: var(--plate); border: 1px solid var(--rule); border-radius: 6px; padding: 10px; }
.plate img { display: block; width: 100%; height: auto; }
figcaption { font-size: 14.5px; color: var(--muted); line-height: 1.45; }
figcaption b { color: var(--ink); font-weight: 600; }
code { font-family: var(--mono); font-size: .9em; }
pre code { font-size: inherit; }
pre { margin: 0; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; overflow-x: auto; font-family: var(--mono); font-size: 13.5px; line-height: 1.6; }
.k { color: var(--accent); font-weight: 500; }
.c { color: var(--muted); font-style: italic; }
.note { font-size: 14.5px; color: var(--muted); max-width: 66ch; }

/* CV entries */
.entry { padding-block: 16px; border-top: 1px solid var(--rule); display: grid; gap: 4px; }
.entry:first-of-type { border-top: 0; padding-top: 0; }
.meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 16px; color: var(--muted); font-size: 15.5px; }
.date { font-family: var(--mono); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.entry p { margin-top: 6px; max-width: 65ch; }
.entry ul { margin: 6px 0 0; padding-left: 20px; }
.entry li { margin: 2px 0; }
.skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 20px 28px; }
.skills h3 { font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }

/* Contact */
.contact { margin-top: 48px; padding-block: 40px 56px; border-top: 1px solid var(--rule); }
.contact-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 14px; }
.email { font-family: var(--mono); font-size: 16px; user-select: all; padding: 9px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; overflow-wrap: anywhere; }
.copied { font-size: 14px; color: var(--accent); min-width: 60px; }
footer { color: var(--muted); font-size: 14px; padding-block: 0 32px; }

@media (max-width: 720px) {
  .hero { padding-block: 32px 28px; }
  .hero-grid { grid-template-columns: 1fr; gap: 24px; }
  .portrait { justify-self: start; max-width: 150px; order: -1; }
  .sec-head { grid-template-columns: 1fr; gap: 4px; }
  .sec-label { padding-top: 0; }
  .figures { grid-template-columns: 1fr; }
  .nav ul { gap: 4px 14px; font-size: 14px; }
}

/* Project card (home) and project page */
.card { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 24px; align-items: start; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 22px; text-decoration: none; color: inherit; }
.card:hover { border-color: var(--accent); }
.card-text { display: grid; gap: 12px; min-width: 0; }
.card h3 { font-size: 23px; }
.card .more { font-weight: 600; color: var(--accent); }
.card .plate { padding: 8px; }
.back { display: inline-block; font-size: 15px; margin-bottom: 18px; }
.page-head { padding-block: 40px 8px; }
@media (max-width: 720px) { .card { grid-template-columns: 1fr; } }

/* Certificates gallery */
[hidden] { display: none !important; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
.cert { min-width: 0; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; align-content: start; background: none; border: 0; padding: 0; text-align: left; cursor: zoom-in; color: inherit; font: inherit; }
.cert .plate { height: 220px; display: flex; align-items: center; justify-content: center; padding: 8px; overflow: hidden; }
.cert .plate img { width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; }
.cert:hover .plate { border-color: var(--accent); }
.cert b { font-size: 15px; font-weight: 600; line-height: 1.35; }
.cert span { font-size: 14px; color: var(--muted); line-height: 1.4; }
.lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(8, 12, 20, .96); display: grid; grid-template-rows: auto 1fr auto; gap: 10px;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.lightbox .lb-top { display: flex; justify-content: flex-end; }
.lightbox .lb-close { font: 600 15px var(--body); padding: 8px 14px; border-radius: 6px; border: 1px solid #fff5; background: #ffffff1a; color: #fff; cursor: pointer; }
.lightbox img { width: 100%; height: 100%; object-fit: contain; min-height: 0; }
.lightbox p { color: #E5EAF2; text-align: center; font-size: 15px; }
</style>
</head>

<footer class="wrap">Ndou Fhumulani · Thohoyandou, Limpopo, South Africa</footer>
<script>
(function () {
  const lb = document.getElementById('lightbox'), img = document.getElementById('lb-img'), cap = document.getElementById('lb-cap');
  let last = null;
  const close = () => { lb.hidden = true; document.body.style.overflow = ''; if (last) last.focus(); };
  document.querySelectorAll('.cert').forEach((b) => b.addEventListener('click', () => {
    const src = b.querySelector('img');
    img.src = src.src; img.alt = src.alt;
    cap.textContent = b.querySelector('b').textContent + ' · ' + b.querySelector('span').textContent;
    last = b; lb.hidden = false; document.body.style.overflow = 'hidden';
    document.getElementById('lb-close').focus();
  }));
  document.getElementById('lb-close').addEventListener('click', close);
  lb.addEventListener('click', (e) => { if (e.target === lb || e.target === img) close(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !lb.hidden) close(); });
})();
</script>
</body>
</html>
